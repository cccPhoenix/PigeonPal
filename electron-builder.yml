appId: cn.pigeonpal.desktop
productName: 鸽友 PigeonPal
executableName: PigeonPal
artifactName: PigeonPal-Setup-${version}-${arch}.${ext}
asar: true
publish:
  provider: github
  owner: cccPhoenix
  repo: PigeonPal
  releaseType: release
  vPrefixedTagName: true
electronUpdaterCompatibility: '>=6.8.12 <7'
directories:
  output: dist
  buildResources: build
files:
  - desktop/**/*.cjs
  - web/assets/icon.png
  - web/assets/icon-windows.png
  - package.json
extraResources:
  - from: build/backend-dist/PigeonPalService
    to: backend/PigeonPalService
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/windows-icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 鸽友 PigeonPal
  deleteAppDataOnUninstall: false

mac:
  icon: web/assets/icon.png
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [arm64]
  artifactName: PigeonPal-${version}-mac-${arch}.${ext}
  category: public.app-category.productivity
  identity: "-"
  notarize: false

name: Windows installer
on:
  push:
    branches: ['codex/desktop-preview']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-build.txt
      - run: npm test
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: python build/smoke_backend.py build/backend-dist/PigeonPalService/PigeonPalService.exe
      - run: ./build/smoke_windows.ps1
      - name: Hash installer
        shell: pwsh
        run: |
          Get-ChildItem dist/PigeonPal-Setup-*-x64.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PigeonPal-Windows-x64
          path: |
            dist/PigeonPal-Setup-*-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

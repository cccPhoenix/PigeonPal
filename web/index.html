<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>PigeonPal</title>
    <link rel="icon" type="image/png" href="./assets/icon.png">
    <link rel="stylesheet" href="./css/tokens.css">
    <link rel="stylesheet" href="./css/mark.css">
    <link rel="stylesheet" href="./css/app.css">
    <script type="module" src="./js/main.js"></script>
  </head>
  <body>
    <div class="app" id="app">
      <nav class="dock" id="dock-nav" aria-label="主导航"></nav>
      <main class="notice" id="notice" aria-label="通知" data-view="notice">
        <div class="pane pane-list" id="pane-list"></div>
        <div class="pane pane-detail" id="pane-detail"></div>
        <section class="pane calendar" id="pane-calendar" aria-label="日历事项" hidden></section>
        <section class="pane user-profile-page" id="pane-user-profile" aria-labelledby="user-profile-title" hidden></section>
        <aside class="notice-progress" id="notice-progress" role="status" aria-live="polite" aria-hidden="true" inert></aside>
      </main>
      <span class="split" id="split" role="separator" aria-orientation="vertical" tabindex="0" aria-label="拖动调整内容栏与对话栏的宽度"></span>
      <button class="chat-scrim" id="chat-scrim" aria-label="收起对话" hidden></button>
      <section class="chat" id="chat" aria-label="对话">
        <header class="head" id="head"></header>
        <div class="log" id="log" tabindex="-1"></div>
        <button class="jump" id="jump" hidden></button>
        <footer class="composer-bar" id="dock"></footer>
      </section>
    </div>
    <div class="layer" id="layer"></div>
    <aside class="update-banner" id="update-banner" role="status" aria-live="polite" hidden></aside>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>PigeonPal</title>
    <link rel="stylesheet" href="./css/tokens.css">
    <link rel="stylesheet" href="./css/mark.css">
    <link rel="stylesheet" href="./css/app.css">
    <script type="module" src="./js/main.js"></script>
  </head>
  <body>
    <div class="app" id="app">
      <aside class="side" id="side" aria-label="会话"></aside>
      <button class="side-scrim" id="side-scrim" aria-label="收起侧栏" hidden></button>
      <main class="main">
        <header class="head" id="head"></header>
        <div class="log" id="log" tabindex="-1"></div>
        <button class="jump" id="jump" hidden></button>
        <footer class="dock" id="dock"></footer>
      </main>
    </div>
    <div class="layer" id="layer"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
